
name: Extract SAADOX archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'SA_DOX.zip'
      - '.github/workflows/extract-saadox.yml'

permissions:
  contents: read
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and create file inventory
        run: |
          set -euo pipefail
          mkdir -p extracted_saadox
          unzip -q SA_DOX.zip -d extracted_saadox

          python3 - <<'PY'
          import os, json

          root = "extracted_saadox"
          files = []

          for base, dirs, names in os.walk(root):
              dirs.sort()
              for name in sorted(names):
                  path = os.path.join(base, name)
                  files.append({
                      "path": os.path.relpath(path, root),
                      "size_bytes": os.path.getsize(path),
                      "extension": os.path.splitext(name)[1].lower()
                  })

          with open("SAADOX_manifest.json", "w") as f:
              json.dump({"file_count": len(files), "files": files}, f, indent=2)

          with open("SAADOX_manifest.txt", "w") as f:
              for item in files:
                  f.write(f'{item["size_bytes"]:>12}  {item["path"]}\n')

          print(f"Extracted {len(files)} files")
          PY

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: saadox-extracted
          path: |
            extracted_saadox/
            SAADOX_manifest.json
            SAADOX_manifest.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
